# Ray runtime env for the training scripts, passed to `ray job submit` as is.
# Contains the E2B and W&B API keys: do not commit or push this file with real keys.
working_dir: ./
excludes: ["/.git/"]

# No `pip:` section: e2b and swebench are already in /opt/venv, and a Ray pip env
# would build a fresh virtualenv on top of the ROCm torch/vLLM stack.

env_vars:
  PYTHONPATH: "verl"
  PYTHONNOUSERSITE: "1"
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"

  NVTE_USE_GROUPED_GEMM_TRITON: "1"

  VLLM_ROCM_USE_AITER: "1"
  # VLLM_ROCM_USE_AITER_MHA: "0"
  # VLLM_ROCM_USE_AITER_LINEAR: "0"
  # VLLM_ROCM_USE_AITER_RMSNORM: "0"

  E2B_API_KEY: ""
  E2B_API_URL: ""
  E2B_SANDBOX_URL: ""

  WANDB_API_KEY: ""
  WANDB_DIR: "/work/runtime/wandb"
